[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-docurag-v2"
version = "0.1.0"
description = "A modular RAG application for PDF question answering"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.2",
    "langchain-openai==1.6.6",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "faiss-cpu==1.15.1",
    "pymupdf==1.28.2",
    "python-dotenv==1.2.3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx>=0.27,<1",
]

[project.scripts]
docurag = "rag_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
